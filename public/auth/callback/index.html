<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anilife - AniList Sign In</title>
  <style>
    body {
      background: #0b0914;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(20, 18, 30, 0.95);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 18px; margin: 0 0 8px 0; font-weight: 700; }
    p { font-size: 13px; color: #a1a1aa; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Authenticating with AniList</h2>
    <p id="msg">Completing authorization...</p>
  </div>
  <script>
    (function() {
      var token = null;
      var code = null;

      // Extract token from hash: #access_token=XYZ&token_type=Bearer
      if (window.location.hash) {
        var hashStr = window.location.hash.substring(1);
        var hashParams = new URLSearchParams(hashStr);
        token = hashParams.get('access_token');
      }

      // Extract code from query params: ?code=XYZ
      if (window.location.search) {
        var searchParams = new URLSearchParams(window.location.search);
        code = searchParams.get('code');
      }

      if (token) {
        try {
          localStorage.setItem('anilife_oauth_token', token);
        } catch(e) {}
      }

      if (window.opener) {
        window.opener.postMessage({
          type: 'OAUTH_AUTH_SUCCESS',
          token: token,
          code: code
        }, '*');
        document.getElementById('msg').textContent = 'Success! Closing window...';
        setTimeout(function() {
          window.close();
        }, 500);
      } else {
        document.getElementById('msg').textContent = 'Success! Redirecting back to Anilife...';
        setTimeout(function() {
          window.location.href = '/';
        }, 800);
      }
    })();
  </script>
</body>
</html>
